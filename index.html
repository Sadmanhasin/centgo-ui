<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CentGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .start{width:100%;max-width:420px;text-align:center}
  .start .brand-mark{width:44px;height:44px;font-size:16px;border-radius:10px;margin:0 auto 14px}
  .start h1{margin:0 0 28px;font-size:22px;font-weight:600;letter-spacing:-.01em}
  .choices{display:grid;gap:12px}
  .choice{display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left;font-weight:600;font-size:15px;transition:border-color .15s,box-shadow .15s}
  .choice:hover{border-color:var(--border-strong);box-shadow:0 4px 14px rgba(17,24,39,.06)}
  .choice:focus-visible{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .choice .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:#f3f4f6;color:var(--text)}
  .choice .ic svg.i{width:20px;height:20px}
  .choice .go{margin-left:auto;color:var(--text-3)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v6c0 4.5 3.2 8 7.5 9 4.3-1 7.5-4.5 7.5-9V6z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.8c1.9.7 3.2 2.6 3.5 5.2"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  </defs>
</svg>
<main class="start">
  <img class="start-logo" src="assets/logo.png" alt="CentGo">
  <h1>CentGo</h1>
  <div class="choices">
    <a class="card choice" href="admin.html"><span class="ic"><svg class="i"><use href="#i-shield"/></svg></span>Admin dashboard<svg class="i go"><use href="#i-chev"/></svg></a>
    <a class="card choice" href="affiliate.html"><span class="ic"><svg class="i"><use href="#i-users"/></svg></span>Affiliate dashboard<svg class="i go"><use href="#i-chev"/></svg></a>
  </div>
</main>
</body>
</html>
