<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Affiliate · CentGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/styles.css">
<!-- world map for the click heatmap (page still works without it) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css">
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>
<style>
  /* ---------- affiliate portal (shared base comes from assets/styles.css) ---------- */
  :root{--ink:#0f172a;--ink-2:#1e293b}
  .page{max-width:1480px}
  .sec{margin-top:20px}

  /* top bar balance */
  .bal-chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;color:var(--text-2);margin-left:auto}
  .bal-chip b{color:var(--text);font-weight:600}
  .bal-chip svg.i{width:16px;height:16px;color:var(--green)}
  .bal-chip:hover{border-color:var(--border-strong)}

  /* announcement */
  .notice{display:grid;grid-template-columns:1.4fr 1fr;background:var(--ink);color:#e2e8f0;border:0;overflow:hidden}
  .notice > div{padding:22px 24px}
  .notice-side{background:var(--ink-2)}
  .notice-h{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:15px;margin-bottom:6px}
  .notice-h svg.i{width:17px;height:17px;color:#93c5fd}
  .notice-date{font-size:12.5px;color:#94a3b8;margin-bottom:12px}
  .notice p{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:#cbd5e1}
  .notice .join{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;font-size:13px;color:#cbd5e1}
  .notice .btn{background:#fff;color:var(--ink);border-color:#fff}
  .notice .btn:hover{background:#e2e8f0}
  .sched{list-style:none;margin:12px 0 16px;padding:0;display:grid;gap:8px}
  .sched li{display:flex;gap:10px;align-items:baseline;font-size:13.5px;color:#cbd5e1}
  .sched li::before{content:"";width:6px;height:6px;border-radius:50%;background:#60a5fa;flex-shrink:0;transform:translateY(-2px)}
  .sched b{color:#fff;font-weight:600}
  .methods{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:#94a3b8}
  .methods span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:6px;padding:3px 9px;font-weight:500}

  /* period cards */
  .periods{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .pcard{padding:16px 18px;display:flex;flex-direction:column}
  .pc-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin-bottom:12px}
  .pc-h svg.i{width:15px;height:15px;color:var(--text-3)}
  .pc-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);padding:4px 0}
  .pc-row b{color:var(--text);font-weight:600}
  .pc-row .vis{display:inline-flex;align-items:center;gap:5px}
  .pc-row .vis svg.i{width:13px;height:13px}
  .pc-profit{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
  .pc-profit span{font-size:12.5px;color:var(--text-2)}
  .pc-profit b{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .pcard.feat{background:var(--ink);border-color:var(--ink);color:#fff}
  .pcard.feat .pc-h,.pcard.feat .pc-row,.pcard.feat .pc-profit span{color:#94a3b8}
  .pcard.feat .pc-h svg.i{color:#60a5fa}
  .pcard.feat .pc-row b,.pcard.feat .pc-profit b{color:#fff}
  .pcard.feat .pc-profit{border-color:rgba(255,255,255,.12)}

  /* summary */
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .scard{padding:16px 18px;display:block}
  a.scard:hover{border-color:var(--border-strong)}
  .scard .t{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--text-2);font-weight:500}
  .scard .t .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
  .scard .t .ic svg.i{width:16px;height:16px}
  .scard .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
  .scard .f{font-size:12.5px;color:var(--text-3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
  .scard .f b{color:var(--text);font-weight:600}

  /* matches */
  .matches{display:flex;gap:12px;overflow-x:auto;padding:14px 18px 18px;scroll-snap-type:x mandatory;scrollbar-width:thin}
  .match{flex:0 0 220px;scroll-snap-align:start;border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fff}
  .match-l{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.05em}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
  .team{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;line-height:1.25;min-width:0}
  .tlogo{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em;flex-shrink:0}
  .vs{font-size:11px;font-weight:600;color:var(--text-3)}
  .match-t{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--text-2);border-top:1px solid #f1f2f4;padding-top:9px}
  .match-t svg.i{width:14px;height:14px;color:var(--text-3)}
  .soon{color:var(--red);font-weight:600}

  /* hot campaigns */
  .hot-row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-top:1px solid #f1f2f4}
  .hot-row:first-child{border-top:0}
  .hot-row .t{flex:1;min-width:0}
  .hot-row .t b{font-weight:600;font-size:14px;margin-right:8px}
  .hot-row .t small{display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:12.5px;margin-top:3px}
  .hot-row .t small svg.i{width:13px;height:13px}
  .hot-row .comm{font-size:13px;color:var(--text-2);white-space:nowrap}
  .hot-row .comm b{color:var(--text)}

  /* performance chart */
  .mtabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
  .mtab{padding:14px 18px;text-align:left;border-bottom:2px solid transparent;margin-bottom:-1px}
  .mtab:hover{background:#fafafa}
  .mtab span{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);font-weight:500}
  .mtab span i{width:8px;height:8px;border-radius:2px}
  .mtab b{display:block;font-size:19px;font-weight:600;margin-top:3px}
  .mtab.on{border-color:var(--c);background:#fcfcfd}
  #chart{width:100%;height:280px;display:block}
  .viewby{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3)}

  /* map + countries */
  .geo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  #worldMap{height:330px;margin:8px 12px 6px}
  .map-off{height:100%;display:grid;place-items:center;color:var(--text-3);font-size:13px;background:#f9fafb;border-radius:8px;text-align:center;padding:16px}
  .jvm-tooltip{font-family:Inter,system-ui,sans-serif!important;font-size:12px!important;background:#0f172a!important;border-radius:6px!important;padding:6px 9px!important}
  .map-legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3);padding:0 18px 14px}
  .map-legend i{display:block;width:120px;height:6px;border-radius:3px;background:linear-gradient(90deg,#dbe7fd,#1d4ed8)}
  .rank{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11.5px;font-weight:600;background:#f3f4f6;color:var(--text-2)}
  .rank.r1{background:#fef3c7;color:#92400e}.rank.r2{background:#e5e7eb;color:#374151}.rank.r3{background:#fde4cf;color:#9a3412}
  .mini{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .mini .bar{width:90px;margin:0;height:4px}
  .mini small{color:var(--text-3);font-size:11px;margin-left:4px}

  /* device / os */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .breakdown{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;padding:14px 18px 18px}
  .breakdown svg.donut{width:150px;height:150px}
  .bd-row{padding:6px 0}
  .bd-top{display:flex;justify-content:space-between;font-size:13px}
  .bd-top b{font-weight:600}
  .bd-top b span{color:var(--text-3);font-weight:400;margin-left:6px}
  .bd-row .bar{margin-top:5px;height:5px}

  /* insights + commission */
  .ins{padding:6px 18px 18px}
  .ins h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);margin:14px 0 8px}
  .best{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
  .best small{display:block;font-size:12px;color:var(--text-3)}
  .best b{font-weight:600}
  .best .r{text-align:right}
  .avgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .avgs div{border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
  .avgs small{display:block;font-size:12px;color:var(--text-3)}
  .avgs b{font-size:18px;font-weight:600}
  .cstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .cstat div{border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
  .cstat small{display:block;font-size:12px;color:var(--text-3)}
  .cstat b{display:block;font-size:20px;font-weight:600;margin:2px 0}
  .kv{display:flex;justify-content:space-between;padding:11px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:13.5px}
  .kv span{color:var(--text-2)}
  .kv b{font-weight:600}
  .kv.total{background:#f9fafb}

  /* support button (replaces refresh) */
  .support-fab{position:fixed;right:20px;bottom:20px;z-index:60;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:22px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(15,23,42,.25)}
  .support-fab:hover{background:var(--ink-2)}
  .support-fab svg.i{width:18px;height:18px}
  .sup-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-weight:500;color:var(--text)}
  a.sup-opt:hover{border-color:var(--border-strong);background:#f9fafb}
  .sup-opt small{display:block;font-weight:400;color:var(--text-3);font-size:12.5px}
  .sup-opt .ic{width:36px;height:36px;border-radius:9px;background:#f3f4f6;display:grid;place-items:center}

  /* other pages */
  .offer-desc{font-size:12.5px;color:var(--text-2);margin:0;line-height:1.5}
  .ofoot{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border)}
  .ofoot .btn{flex:1;justify-content:center}
  .copy-field{display:flex;gap:8px}
  .copy-field input{flex:1;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;background:#f9fafb}
  .pay-method{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--border);font-size:13px;color:var(--text-2);flex-wrap:wrap}
  .pay-method b{color:var(--text);font-weight:500}
  .pay-method a{margin-left:auto}
  .fsec-foot{display:flex;justify-content:flex-end;margin-top:16px}
  .day-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);padding:14px 18px 6px}
  .sch-row{display:grid;grid-template-columns:90px 70px 1fr auto;gap:14px;align-items:center;padding:11px 18px;border-top:1px solid #f1f2f4;font-size:13.5px}
  .sch-row .teams-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:500}
  .sch-row .tlogo{width:26px;height:26px;font-size:10px}

  /* ---------- premium palette: deep jewel tones + soft gold ---------- */
  :root{
    --ink:#0b0b0c; --ink-2:#18181b;
    --brand:#1fd65f; --brand-d:#0e9f45; --brand-s:#eafbf0;
    /* older names kept so every rule picks up the brand palette */
    --indigo:#18181b; --indigo-d:#000; --indigo-s:#f2f2f3;
    --emerald:#0e9f45; --emerald-d:#053d1c; --emerald-s:#eafbf0;
    --violet:#15803d; --violet-d:#052e16; --violet-s:#eef8f1;
    --gold:#0e9f45; --gold-b:#1fd65f; --gold-s:#eafbf0;
    --accent:#0e9f45; --accent-soft:#eafbf0;
    --bg:#f5f6f5;
  }
  body{background:var(--bg)}
  .card{box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .brand-logo{width:36px;height:36px;border-radius:9px;display:block}
  .nav-item.active{background:var(--ink);color:#fff}
  .nav-item.active svg.i{color:var(--gold-b)}
  .nav-item.active .badge{background:rgba(255,255,255,.14);color:#fff}
  /* balance: highlighted in the logo colours */
  .bal-chip{height:40px;padding:0 6px 0 14px;gap:10px;background:var(--ink);border-color:var(--ink);color:#d4d4d8;border-radius:10px;box-shadow:0 6px 16px rgba(11,11,12,.18)}
  .bal-chip svg.i{color:var(--brand);width:17px;height:17px}
  .bal-chip span{font-size:12.5px;font-weight:500}
  .bal-chip b{color:#062b14;background:var(--brand);border-radius:7px;padding:4px 10px;font-size:14px;font-weight:700}
  .bal-chip:hover{background:#18181b;border-color:#18181b}

  /* commission status inside the dark banner */
  .notice-side .ins{padding:0}
  .notice-side .cstat{margin-top:12px}
  .notice-side .cstat div{background:rgba(255,255,255,.05)!important;border-color:rgba(255,255,255,.1)!important}
  .notice-side .cstat small{color:#a1a1aa}
  .notice-side .cstat .pend b{color:#fcd34d!important}
  .notice-side .cstat .rel b{color:var(--brand)!important}
  .notice-side h3{color:#a1a1aa;margin:16px 0 8px}
  .notice-side .kv{background:transparent;border-color:rgba(255,255,255,.1);padding:9px 12px;margin-bottom:6px}
  .notice-side .kv span{color:#a1a1aa}
  .notice-side .kv b{color:#fff}
  .notice-side .kv.total{background:rgba(31,214,95,.1);border-color:rgba(31,214,95,.35)}
  .notice-side .kv.total span{color:#d9fbe5}
  .notice-side .kv.total b{color:var(--brand)}

  /* payment notice: its own card, one row, right under the top banner */
  .pay-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-top:14px;padding:14px 18px}
  .pr-title{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .pr-title b{display:block;font-size:14px;font-weight:600}
  .pr-title small{display:block;font-size:12px;color:var(--text-3)}
  .pr-sched{list-style:none;margin:0;padding:0 0 0 24px;border-left:1px solid var(--border);display:grid;gap:5px;flex:1;min-width:260px}
  .pr-sched li{position:relative;padding-left:14px;font-size:13.5px;color:var(--text-2)}
  .pr-sched li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--brand)}
  .pr-sched b{color:var(--ink);font-weight:600}
  .pr-methods small{display:block;font-size:12px;color:var(--text-3);margin-bottom:5px}
  .pr-methods div{display:flex;gap:6px;flex-wrap:wrap}
  .pr-methods span{border:1px solid #c6f0d5;background:var(--brand-s);color:#14532d;border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600}
  .pr-next{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:9px;background:var(--ink);color:#fff;flex-shrink:0}
  .pr-next svg.i{width:17px;height:17px;color:var(--brand)}
  .pr-next small{display:block;font-size:11.5px;color:#a1a1aa}
  .pr-next b{display:block;font-size:14px;color:var(--brand);font-weight:700}
  @media (max-width:900px){.pr-sched{border-left:0;padding-left:0;flex-basis:100%}}

  /* performance insights at full width */
  .bests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .bests .best{margin:0}
  .ins-wide .avgs{grid-template-columns:repeat(3,1fr)}
  @media (max-width:800px){.bests{grid-template-columns:1fr}.methods .nx{margin-left:0}}

  /* schedules */
  .sch-filters{padding:16px 18px 10px;margin-bottom:16px}
  .fl-label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:2px 0 8px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:thin}
  .chip-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--border);border-radius:18px;background:#fff;font-weight:500;font-size:13px;white-space:nowrap;color:var(--text-2)}
  .chip-btn:hover{border-color:var(--border-strong);color:var(--text)}
  .chip-btn .cnt{font-size:11.5px;background:#f2f2f3;color:var(--text-2);border-radius:10px;padding:1px 7px}
  .chip-btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip-btn.on .cnt{background:var(--brand);color:#062b14}
  .lg-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:64px}
  .mgrid .match{flex:none}
  .teams.one{grid-template-columns:1fr}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#d92d20;box-shadow:0 0 0 3px #fdeceb;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(217,45,32,.08)}}

  /* my links / reports / billing */
  .camp-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--ink);background:#f2f2f3;border-radius:6px;padding:3px 9px}
  .camp-tag:hover{background:var(--brand-s);color:var(--brand-d)}
  .ar-pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:8px;background:var(--ink);color:#d4d4d8;font-size:13px;font-weight:500}
  .ar-pill svg.i{width:15px;height:15px;color:var(--brand)}
  .ar-pill b{color:var(--brand);font-weight:700;min-width:30px}
  .rec-badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2)}
  .rec-badge b{background:var(--brand);color:#062b14;border-radius:6px;padding:2px 9px;font-size:13px;letter-spacing:0}
  .date-tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:#14532d;background:var(--brand-s);border:1px solid #c6f0d5;border-radius:6px;padding:3px 9px}
  .amt-tag{display:inline-block;font-weight:700;color:#fff;background:var(--ink);border-radius:6px;padding:3px 10px;font-size:13px}
  .scard.bal-card{background:radial-gradient(130% 120% at 100% 0%,#123d22 0%,#0b0b0c 60%);border-color:transparent;color:#fff}
  .scard.bal-card .t{color:#a1a1aa}
  .scard.bal-card .t .ic{background:rgba(31,214,95,.15);color:var(--brand)}
  .scard.bal-card .v{color:var(--brand)}
  .scard.bal-card .f{color:#a1a1aa;border-color:rgba(255,255,255,.12)}
  .scard.bal-card .f b{color:#fff}
  .rbtn.dl{display:inline-flex;align-items:center;justify-content:center;padding:0;width:34px;height:34px;border-radius:7px;color:var(--text-2);border:1px solid var(--border);vertical-align:middle}
  .rbtn.dl:hover{background:var(--brand-s)!important;color:var(--brand-d)!important;border-color:#c6f0d5}

  /* profile */
  .prof-cover{height:150px;border-radius:12px;background:radial-gradient(120% 160% at 100% 0%,#14532d 0%,#0b0b0c 60%)}
  .prof-card{margin:-60px 20px 64px;position:relative}
  .prof-card .prof-top{display:flex;align-items:center;gap:16px;padding:20px 22px;border-bottom:1px solid var(--border)}

  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : v;

}
function copyText(text, msg='Copied'){

}

const CLICKS = [], CONVS = [];
(() => {
  const r = rng(2024), pick = a => a[Math.floor(r()*a.length)], weights = [5,4,3,2,1];
  for(let d=179; d>=0; d--){

    if(d===0) n = Math.round(n * (TODAY.getHours()+1)/24);

    const total = live.reduce((t,_,i) => t + weights[i], 0), visitors = Math.max(1, Math.round(n*0.8));
    for(let i=0;i<n;i++){
      let x = r()*total, link = live[0];
      for(let j=0;j<live.length;j++){ x -= weights[j]; if(x<=0){ link = live[j]; break; } }
      const t = dayStart + (d===0 ? r()*(NOW-dayStart) : r()*DAY);
      const dev = pick(['Desktop','Desktop','Desktop','Mobile','Mobile','Mobile','Tablet','Bot']);
      const os = dev==='Bot' ? pick(['Linux','Windows']) : dev==='Desktop' ? pick(['Windows','Windows','Windows','macOS','Linux','Chromium OS']) : pick(['Android','Android','iOS']);
      const c = {date:new Date(t), code:link.code, offer:link.offer, country:pick(COUNTRY_W), device:dev, os,

      CLICKS.push(c);

        amount:+(payoutOf(offerById(c.offer))*(0.8 + r()*0.4)).toFixed(2)});

// payouts follow the schedule: 1st–15th paid on the 22nd, 16th–end paid on the 7th of next month
let PAYOUTS = [], PAID_CUTOFF = -Infinity;
(() => {
  const periods = [];
  for(let k=13; k>=0; k--){   // 7 months of half-month pay periods (covers all 180 days of data)
    const m = new Date(TODAY.getFullYear(), TODAY.getMonth()-Math.floor(k/2), 1);
    if(k%2===1) periods.push({start:m.getTime(), end:new Date(m.getFullYear(), m.getMonth(), 15, 23,59,59).getTime(), pay:new Date(m.getFullYear(), m.getMonth(), 22, 11)});
    else periods.push({start:new Date(m.getFullYear(), m.getMonth(), 16).getTime(), end:new Date(m.getFullYear(), m.getMonth()+1, 0, 23,59,59).getTime(), pay:new Date(m.getFullYear(), m.getMonth()+1, 7, 11)});
  }
  periods.filter(p => p.pay.getTime() <= NOW).forEach((p, i) => {
    const amount = +sumBy(CONVS.filter(c => c.date.getTime() >= p.start && c.date.getTime() <= p.end), 'amount').toFixed(2);
    PAID_CUTOFF = Math.max(PAID_CUTOFF, p.end);
    const pm = i >= 9 ? ['BD Bank','•••• 4821'] : i >= 5 ? ['Wise','alex42@mail.com'] : ['Binance','ID 58210473'];
    if(amount > 0) PAYOUTS.push({date:p.pay, amount, method:pm[0], account:pm[1], status:'paid', ref:`PO-${3101+i}`,

      period:`${shortDate(new Date(p.start))} – ${shortDate(new Date(p.end))}`});
  });

})();

}

function bestBy(keyFn, labelFn){
  const g = new Map();
  CONVS.forEach(c => { const k = keyFn(c.date), v = g.get(k) || {k, profit:0, conv:0}; v.profit += c.amount; v.conv++; g.set(k, v); });

  return best ? {...best, label:labelFn(best.k)} : null;
}

    g += `<rect x="${(x+(colW-barW)/2).toFixed(1)}" y="${(pad.t+ih-h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${m.color}" opacity=".88"/>`;
    if((n-1-i)%step===0) g += `<text x="${x+colW/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#9ca3af">${r.label}</text>`;
  });
  g += `<rect id="hit" x="${pad.l}" y="${pad.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  const tip = $('#tip'), hl = $('#hl');
  $('#hit').onpointermove = $('#hit').onpointerdown = e => {
    const rect = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n-1, Math.floor(((e.clientX-rect.left)/rect.width*W - pad.l)/colW))), r = rows[i];
    hl.setAttribute('x', pad.l + i*colW); hl.setAttribute('visibility','visible');
    tip.innerHTML = `<span>${state.view==='weekly' ? 'Week of ' : ''}${r.label}</span>` + M.map(x => `<div class="row"><i style="background:${x.color}"></i>${x.label}<b>${x.f(r[x.k])}</b></div>`).join('');
    tip.style.left = Math.min(Math.max((pad.l+(i+.5)*colW)/W*rect.width + 18, 100), rect.width-90) + 'px'; tip.style.top = (e.clientY-rect.top+12) + 'px'; tip.style.opacity = 1;
  };
  $('#hit').onpointerleave = () => { tip.style.opacity = 0; hl.setAttribute('visibility','hidden'); };
}

function drawCountries(s){

  s.cl.forEach(c => (by[c.country] ||= {code:c.country, clicks:0, conv:0, profit:0}).clicks++);

  const list = Object.values(by).sort((a,b) => b.profit-a.profit || b.clicks-a.clicks), maxP = Math.max(1, ...list.map(x => x.profit));
  $('#countryTable').innerHTML = `<table>

function drawMap(list){

      regionStyle:{initial:{fill:'#eef0f3', stroke:'#fff', strokeWidth:.5}, hover:{fillOpacity:.8, cursor:'default'}},

function drawBreakdown(el, entries, total){

function genCode(){
  const base = ME.name.split(' ')[0].toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5) || 'AFF';
  let c; do { c = base + Math.floor(10 + Math.random()*90); } while(MY_LINKS.some(l => l.code.toLowerCase()===c.toLowerCase()));
  return c;
}
function codeError(code, self){
  if(!/^[A-Za-z0-9_-]{3,20}$/.test(code)) return 'Use 3–20 letters, numbers, - or _ (no spaces).';
  if(MY_LINKS.some(l => l !== self && l.code.toLowerCase()===code.toLowerCase())) return 'This coupon code is already taken.';
  return '';
}

/* ============ date ranges (reports, links) ============ */
const RANGE_OPTS = {all:'All time', today:'Today', yesterday:'Yesterday', '7d':'Last 7 days', '30d':'Last 30 days', '90d':'Last 90 days', '6m':'Last 6 months', custom:'Custom range…'};
const rangeLabel = v => {
  const a = new Date(v.from+'T12:00'), b = new Date(v.to+'T12:00'), o = {month:'short', day:'numeric'}, y = {...o, year:'numeric'};
  if(v.from===v.to) return a.toLocaleDateString('en-US', y);
  return `${a.toLocaleDateString('en-US', a.getFullYear()===b.getFullYear() ? o : y)} – ${b.toLocaleDateString('en-US', y)}`;
};
function bounds(f){
  switch(f.range){
    case 'today': return {start:SOD, end:NOW};
    case 'yesterday': return {start:SOD-DAY, end:SOD-1};
    case '7d': return {start:SOD-6*DAY, end:NOW};
    case '30d': return {start:SOD-29*DAY, end:NOW};
    case '90d': return {start:SOD-89*DAY, end:NOW};
    case '6m':  return {start:new Date(TODAY.getFullYear(), TODAY.getMonth()-6, TODAY.getDate()).getTime(), end:NOW};
    case 'custom': return {start:new Date(f.custom.from+'T00:00').getTime(), end:new Date(f.custom.to+'T23:59:59.999').getTime()};
    default: return {start:0, end:Infinity};
  }
}
const inRange = (d, f) => inB(d, bounds(f));
const rangeSlug = f => f.range==='custom' ? `${f.custom.from}_to_${f.custom.to}` : `${f.range}-${isoDay(new Date())}`;
let RP = null;
function closeRangePicker(cancelled){ if(!RP) return; const {el, onCancel, off} = RP; RP = null; el.remove(); off(); if(cancelled && onCancel) onCancel(); }
function openRangePicker(anchor, cur, onApply, onCancel){
  closeRangePicker(true);
  const today = isoDay(TODAY), el = document.createElement('div'), firstOf = (y, m) => isoDay(new Date(y, m, 1));
  const quick = {'14':[isoDay(new Date(NOW-13*DAY)), today, 'Last 14 days'], '90':[isoDay(new Date(NOW-89*DAY)), today, 'Last 90 days'],
    tm:[firstOf(TODAY.getFullYear(), TODAY.getMonth()), today, 'This month'], lm:[firstOf(TODAY.getFullYear(), TODAY.getMonth()-1), isoDay(new Date(TODAY.getFullYear(), TODAY.getMonth(), 0)), 'Last month']};
  el.className = 'rpop'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Custom date range');
  el.innerHTML = `<div class="rpop-h">Custom range</div><div class="rpop-q">${Object.entries(quick).map(([k,q]) => `<button type="button" data-q="${k}">${q[2]}</button>`).join('')}</div>
    <div class="rpop-f"><label>From<input type="date" max="${today}" value="${cur?.from || isoDay(new Date(NOW-6*DAY))}"></label><label>To<input type="date" max="${today}" value="${cur?.to || today}"></label></div>
    <div class="rpop-err" aria-live="polite"></div><div class="rpop-a"><button type="button" class="btn sm" data-x>Cancel</button><button type="button" class="btn sm primary" data-ok>Apply</button></div>`;
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth || 300;
  el.style.top = (r.bottom + window.scrollY + 6) + 'px';
  el.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - w - 8)) + 'px';
  const [from, to] = $$('input', el), err = $('.rpop-err', el);
  $$('[data-q]', el).forEach(b => b.onclick = () => { [from.value, to.value] = quick[b.dataset.q]; err.textContent = ''; });
  const ok = () => {
    const f = from.value, t = to.value;
    const msg = !f || !t ? 'Pick both dates' : f > t ? 'Start date must be before the end date' : t > today ? 'End date can’t be in the future' : (new Date(t) - new Date(f))/DAY > 365 ? 'Pick a range of one year or less' : '';
    if(msg){ err.textContent = msg; return; }
    closeRangePicker(false); onApply({from:f, to:t});
  };
  $('[data-ok]', el).onclick = ok; $('[data-x]', el).onclick = () => closeRangePicker(true);
  el.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); ok(); } });
  const outside = e => { if(!el.contains(e.target) && !anchor.contains(e.target)) closeRangePicker(true); };
  setTimeout(() => document.addEventListener('mousedown', outside));
  RP = {el, onCancel, off: () => document.removeEventListener('mousedown', outside)};
  from.focus();
}
function mountRange(wrap, f, keys, onChange){
  const draw = () => {
    wrap.innerHTML = `<select class="sel" aria-label="Date range">${keys.map(k => `<option value="${k}" ${f.range===k?'selected':''}>${RANGE_OPTS[k]}</option>`).join('')}</select>`
      + (f.range==='custom' && f.custom ? `<button type="button" class="btn rchip" title="Change dates">${icon('calendar')}${rangeLabel(f.custom)}</button>` : '');
    const sel = $('select', wrap), chip = $('.rchip', wrap);
    const pick = () => openRangePicker(chip || sel, f.custom, v => { f.custom = v; f.range = 'custom'; draw(); onChange(); }, () => { sel.value = f.range; });
    sel.onchange = () => { if(sel.value==='custom') return pick(); f.range = sel.value; draw(); onChange(); };
    if(chip) chip.onclick = pick;
  };
  draw();
}

/* ============ tables + modals ============ */
function pagerHtml(page, pages){
  const nums = []; for(let p=1;p<=pages;p++){ if(p===1||p===pages||Math.abs(p-page)<=1) nums.push(p); else if(nums.at(-1)!=='…') nums.push('…'); }
  return `<div class="pager"><button data-p="${page-1}" ${page===1?'disabled':''} aria-label="Previous">${icon('chevl')}</button>
    ${nums.map(p => p==='…' ? `<span class="muted" style="padding:0 4px">…</span>` : `<button data-p="${p}" class="${p===page?'on':''}">${p}</button>`).join('')}
    <button data-p="${page+1}" ${page===pages?'disabled':''} aria-label="Next">${icon('chev')}</button></div>`;
}
function pagedTable(el, key, cols, rows, emptyMsg, per=10, onRender){
  const pages = Math.max(1, Math.ceil(rows.length/per)), page = Math.min(state.tp[key] || 1, pages);
  const slice = rows.slice((page-1)*per, page*per), offset = (page-1)*per;
  el.innerHTML = `<div class="table-wrap" style="margin:0"><table><thead><tr>${cols.map(c => `<th class="${c.r?'r':''}">${c.h}</th>`).join('')}</tr></thead>
      <tbody>${slice.length ? slice.map((row,i) => `<tr class="static">${cols.map(c => `<td class="${c.r?'r num':''}">${c.v(row, offset+i)}</td>`).join('')}</tr>`).join('')
        : `<tr class="empty-row"><td colspan="${cols.length}">${emptyMsg}</td></tr>`}</tbody></table></div>
    ${rows.length ? `<div class="card-foot"><span>Showing ${fmt(offset+1)}–${fmt(offset+slice.length)} of ${fmt(rows.length)}</span>${pages>1 ? pagerHtml(page, pages) : ''}</div>` : ''}`;
  $$('[data-p]', el).forEach(b => b.onclick = () => { state.tp[key] = +b.dataset.p; pagedTable(el, key, cols, rows, emptyMsg, per, onRender); });
  $$('[data-copy]', el).forEach(b => b.onclick = () => copyText(b.dataset.copy, 'Link copied'));
  onRender?.(page, pages);
}
function openModalForm({title, sub, html, save='', onSave=null, cancel='Cancel', danger=false}){
  $('#formSave').classList.toggle('danger-btn', danger);
  $('#formTitle').textContent = title; $('#formSub').textContent = sub || ''; $('#formSub').style.display = sub ? '' : 'none';

    const mark = (name, bad, msg) => { const l = $(`#mForm [name="${name}"]`).closest('label'); l.classList.toggle('bad', !!bad); if(msg){ const h = $('.hint', l); if(h) h.textContent = msg; } return !!bad; };

    $('#bSum').innerHTML = `<span><b>${rows.length}</b> payment${rows.length===1?'':'s'} · <b class="num">${money(sumBy(rows,'amount'))}</b>${filtered ? ' (filtered)' : ''}</span>${filtered ? '<button class="link-btn" id="bClear2">Clear filters</button>' : ''}`;
    const clear = () => { Object.assign(f, {q:'', method:'all', range:'all', custom:null}); renderBilling(); };
    $('#bClear')?.addEventListener('click', clear); $('#bClear2')?.addEventListener('click', clear);
  };
  $('#bList').onclick = e => { const b = e.target.closest('[data-inv]'); if(b) downloadInvoice(PAYOUTS[+b.dataset.inv]); };
  $('#bQ').oninput = e => { f.q = e.target.value.trim(); draw(); };
  mountRange($('#bRange'), f, ['all','30d','90d','6m','custom'], draw);
  draw();
}

<style>body{font-family:Inter,Arial,sans-serif;color:#111;max-width:640px;margin:40px auto;padding:0 20px}h1{font-size:20px;margin:0}.muted{color:#71717a}
table{width:100%;border-collapse:collapse;margin-top:24px}td{padding:10px 0;border-bottom:1px solid #e5e7eb}td:last-child{text-align:right}.total td{font-weight:700;border:0;font-size:16px}</style></head>
<body><h1>CentGo — Payment receipt</h1><p class="muted">${p.ref} · Paid on ${dateFmt(p.date)}</p>
<p><b>${esc(ME.name)}</b><br>${esc(ME.email)}</p>
<table><tr><td>${esc(p.desc)}<br><span class="muted">Earnings period ${p.period}</span></td><td>${money(p.amount)}</td></tr>
<tr><td>Payment method</td><td>${esc(p.method)} ${esc(p.account)}</td></tr><tr class="total"><td>Total paid</td><td>${money(p.amount)}</td></tr></table></body></html>`;

}

function bindPasswordCard(){
  const form = $('#pwForm'), f = form.elements;
  // show / hide each password field
  $$('.pw-eye', form).forEach(b => b.onclick = () => { const i = b.previousElementSibling; i.type = i.type==='password' ? 'text' : 'password'; b.classList.toggle('on', i.type==='text'); });
  // simple strength meter: length, number, upper+lower, symbol
  f.next.oninput = () => {
    const p = f.next.value, score = !p ? 0 : [p.length>=8, /\d/.test(p), /[a-z]/.test(p) && /[A-Z]/.test(p), /[^A-Za-z0-9]/.test(p)].filter(Boolean).length;
    $('#pwMeter').dataset.s = score;
  };
  const mark = (n, bad) => { form.elements[n].closest('label').classList.toggle('bad', !!bad); return !!bad; };
  form.onsubmit = e => {
    e.preventDefault();
    const a = mark('current', !f.current.value), b = mark('next', f.next.value.length < 8 || !/\d/.test(f.next.value));
    const c = mark('confirm', !b && f.next.value !== f.confirm.value);
    if(!a && !b && f.next.value === f.current.value){ mark('next', true); $('.hint', f.next.closest('label')).textContent = 'New password must be different from the current one'; return; }
    $('.hint', f.next.closest('label')).textContent = 'At least 8 characters, including a number';
    if(a || b || c) return;
    form.reset(); $('#pwMeter').dataset.s = 0; ME.pwChanged = new Date();
    $('#pwChanged').textContent = 'Last changed just now';
    toast('Password updated');
  };
  $('#forgotPw').onclick = openForgotPassword;
}

/* ============ mobile: tables render as cards (see "Mobile standard" in styles.css) ============ */
// each cell gets its column name as data-label; one meaningful column becomes the card title
const TITLE_COLS = ['Affiliate','Name','Campaign','Coupon / link','Coupon code','Offer','Link','Country','Device','Date','Duration','Paid on'];
function labelTables(root){
  root.querySelectorAll('table').forEach(t => {
    const hs = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    if(!hs.length) return;
    const ti = TITLE_COLS.map(c => hs.indexOf(c)).find(i => i >= 0);
    t.querySelectorAll('tbody tr').forEach(tr => {
      if(tr.dataset.lab) return; tr.dataset.lab = '1';
      [...tr.children].forEach((td, i) => {
        if(td.colSpan > 1) return;
        td.setAttribute('data-label', hs[i] || '');
        // one wrapper per cell so multi-part values (code + domain, Skype + Telegram) stack on the right
        if(!td.firstElementChild || !td.firstElementChild.classList.contains('cv') || td.childNodes.length > 1){ const w = document.createElement('div'); w.className = 'cv'; while(td.firstChild) w.appendChild(td.firstChild); td.appendChild(w); }
        if(hs[i]==='No' || hs[i]==='#') td.classList.add('m-hide');
        if(i===ti) td.classList.add('m-title');
      });
    });
  });
}
